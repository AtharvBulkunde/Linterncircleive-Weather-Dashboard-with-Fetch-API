<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🌤️ Live Weather Dashboard</h1>
      <form id="search-form" autocomplete="off">
        <input
          type="text"
          id="city-input"
          placeholder="Search any city (e.g. Mumbai)"
          aria-label="City name"
        />
        <button type="submit">Search</button>
      </form>
      <p id="error-msg" class="error" role="alert"></p>
    </header>

    <!-- Default cities: Nashik & Pune -->
    <section class="default-cities">
      <div class="city-card" id="card-nashik">
        <h2>Nashik</h2>
        <p class="country muted">Maharashtra, India</p>
        <div class="city-body">
          <img class="icon" src="" alt="weather icon" />
          <div>
            <p class="temp">--°C</p>
            <p class="desc muted">--</p>
            <p class="extra muted small">--</p>
          </div>
        </div>
        <div class="mini-forecast"></div>
      </div>

      <div class="city-card" id="card-pune">
        <h2>Pune</h2>
        <p class="country muted">Maharashtra, India</p>
        <div class="city-body">
          <img class="icon" src="" alt="weather icon" />
          <div>
            <p class="temp">--°C</p>
            <p class="desc muted">--</p>
            <p class="extra muted small">--</p>
          </div>
        </div>
        <div class="mini-forecast"></div>
      </div>
    </section>

    <!-- Search result (hidden until user searches) -->
    <main id="dashboard" class="hidden">
      <section id="current" class="card current">
        <h2 id="city-name">—</h2>
        <p id="country" class="muted"></p>
        <div class="current-body">
          <img id="current-icon" src="" alt="weather icon" />
          <div>
            <p id="current-temp" class="temp">--°C</p>
            <p id="current-desc" class="muted">--</p>
            <p id="current-extra" class="muted small"></p>
          </div>
        </div>
      </section>

      <section id="forecast" class="forecast">
        <h3>5-Day Forecast</h3>
        <div id="forecast-grid" class="forecast-grid"></div>
      </section>
    </main>

    <div id="loader" class="loader hidden">Loading…</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
